brains:
  # `thinks: true` flags models that emit <think>...</think> reasoning blocks.
  # The frontend gates token-streaming detection on this flag — thinking models
  # buffer until </think> appears, non-thinking models stream immediately.
  #
  # ── Ollama brains (default — used when LLM_BACKEND=ollama) ───────────────
  - id: qwen3-4b-instruct
    label: "Qwen3 4B Instruct (default — fast, no reasoning)"
    kind: ollama
    model: qwen3:4b-instruct
    default: true
    thinks: false
  - id: smollm2-360m
    label: "SmolLM2 360M (tiny / dumb)"
    kind: ollama
    model: smollm2:360m
    thinks: false
  - id: qwen3-4b-thinking
    label: "Qwen3 4B Thinking (always reasons — slower, see the chain)"
    kind: ollama
    model: qwen3:4b
    thinks: true
  - id: deepseek-r1-8b
    label: "DeepSeek-R1 8B (reasoning)"
    kind: ollama
    model: deepseek-r1:8b
    thinks: true
  # ── LM Studio brains (Plan #11, opt-in via LLM_BACKEND=lmstudio) ─────────
  # kind: lmstudio talks LM Studio's NATIVE REST API at <LMSTUDIO_URL>/api/v0.
  # When LLM_BACKEND=lmstudio, the orchestrator ALSO auto-discovers every model
  # in your LM Studio library at runtime and adds each as a selectable
  # `lmstudio:<model-id>` brain — so this static list is just the stable
  # defaults. `lmstudio-auto` follows whatever model you have loaded in LM
  # Studio; it is promoted to the default brain at startup only when LM Studio
  # is the active backend.
  - id: lmstudio-auto
    label: "LM Studio (auto — uses your loaded model)"
    kind: lmstudio
    model: auto
    thinks: false
  - id: lmstudio-qwen3-4b
    label: "LM Studio · Qwen3 4B 2507 (small + fast)"
    kind: lmstudio
    model: qwen/qwen3-4b-2507
    thinks: false
  # ── Cloud brains (require API keys) ──────────────────────────────────────
  - id: claude-sonnet
    label: "Claude Sonnet 4.6 (cloud)"
    kind: cloud-litellm
    model: anthropic/claude-sonnet-4-6
    requires_key: ANTHROPIC_API_KEY
    thinks: false
  - id: openai-gpt-4o
    label: "OpenAI GPT-4o (cloud)"
    kind: cloud-litellm
    model: openai/gpt-4o
    requires_key: OPENAI_API_KEY
    thinks: false
  - id: groq-llama
    label: "Groq Llama-3.3-70B (cloud, fast)"
    kind: cloud-litellm
    model: groq/llama-3.3-70b-versatile
    requires_key: GROQ_API_KEY
    thinks: false

