server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files with caching
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ONNX/WASM files need correct MIME types (nginx doesn't know .mjs)
    location ~* \.mjs$ {
        types { } default_type application/javascript;
    }
    location ~* \.wasm$ {
        types { } default_type application/wasm;
    }

    # Cache assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy STT requests to whisper.cpp container
    location /api/stt/ {
        proxy_pass http://stt:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 25M;
    }

    # Proxy TTS requests to Kokoro-FastAPI container
    location /api/tts/ {
        proxy_pass http://tts:8880/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Proxy LLM requests to the orchestrator (Plan #7 migrated from llama.cpp
    # container 'llm:8080' to orchestrator service 'orchestrator:8082').
    location /api/llm/ {
        proxy_pass http://orchestrator:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # Plan #8 dashboard control plane (/v1/catalog, /v1/state, /v1/swap,
    # /v1/personality/custom). Same backend as /api/llm/, different prefix
    # so the dashboard's fetch wrappers (frontend/src/dashboard/api.js)
    # resolve. Without this the dashboard renders "offline (orchestrator
    # unreachable)" even though chat completions work.
    location /api/orch/ {
        proxy_pass http://orchestrator:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # Lab 1 path: proxy DIRECTLY to Ollama on the host (bypasses the
    # orchestrator's personality system prompt + agentic tool loop). Lab 1
    # is "The Brain — raw LLM"; pedagogically it has to show bare TTFT
    # and tokens/sec without Plan #7 overhead. Lab 4 is where the
    # orchestrator gets demoed.
    # Requires the frontend compose service to have
    # `extra_hosts: ["host.docker.internal:host-gateway"]` so this name resolves.
    location /api/ollama/ {
        proxy_pass http://host.docker.internal:11434/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # Plan #11: direct passthrough to LM Studio's native API on the host
    # (bypasses the orchestrator) for Lab 1's raw model-latency playground.
    # Same rationale as /api/ollama/ above. LM Studio must be "Served on Local
    # Network"; requires host.docker.internal:host-gateway on this service.
    location /api/lmstudio/ {
        proxy_pass http://host.docker.internal:1234/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # CORS headers for development
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type";
}
