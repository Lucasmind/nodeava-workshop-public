server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ONNX/WASM MIME types
    location ~* \.mjs$ {
        types { } default_type application/javascript;
    }
    location ~* \.wasm$ {
        types { } default_type application/wasm;
    }

    # Cache assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # On Mac, stt and tts run NATIVELY on the host (via Metal/MPS) — they
    # are not Docker containers, so we can't proxy to `http://stt:8080`.
    # Use host.docker.internal which Docker Desktop on Mac maps to the
    # host machine's loopback. (See docker-compose.mac.yml for the volume
    # mount that swaps this config in.)
    location /api/stt/ {
        proxy_pass http://host.docker.internal:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 25M;
    }

    location /api/tts/ {
        proxy_pass http://host.docker.internal:8880/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Orchestrator still runs in Docker on Mac, so use the service name.
    location /api/llm/ {
        proxy_pass http://orchestrator:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    location /api/orch/ {
        proxy_pass http://orchestrator:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type";
}
